<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body class="bg-light">

    <header class="bg-dark text-white py-3 mb-4 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 mb-0">PLANIFICADOR DE TAREAS</h1>

            <div class="d-flex align-items-center gap-2">
                <div class="badge bg-light text-dark px-3 py-2 fw-bold">
                    📋 Tareas: 0
                </div>
                <button class="btn btn-outline-light btn-sm" id="btn-modo">Modo Oscuro</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="row g-4">
            
            <section class="col-lg-7">
                <div class="card shadow-sm p-4 bg-secondary-subtle">
                    <h2 class="h5 mb-3 text-secondary fw-bold">LISTA DE TAREAS</h2>
                    
                    <div class="mb-4 p-3 bg-white rounded shadow-sm">
                        <div class="mb-3">
                            <label for="buscarTarea" class="form-label text-muted small fw-bold">BUSCAR TAREA</label>
                            <input type="text" class="form-control form-control-sm" id="buscarTarea" placeholder="Escribe para buscar por nombre...">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">ESTADO</label>
                            <div class="btn-group w-100" role="group" aria-label="Filtros de estado">
                                <button type="button" class="btn btn-outline-secondary btn-sm active">Todas</button>
                                <button type="button" class="btn btn-outline-secondary btn-sm">Pendientes</button>
                                <button type="button" class="btn btn-outline-secondary btn-sm">Completadas</button>
                            </div>
                        </div>

                        <div class="row g-2">
                            <div class="col-4">
                                <label for="filtroPrioridad" class="form-label text-muted small fw-bold">PRIORIDAD</label>
                                <select class="form-select form-select-sm" id="filtroPrioridad">
                                    <option selected>Todas</option>
                                    <option value="Alta">Alta</option>
                                    <option value="Media">Media</option>
                                    <option value="Baja">Baja</option>
                                </select>
                            </div>
                            <div class="col-4">
                                <label for="filtroCategoria" class="form-label text-muted small fw-bold">CATEGORÍA</label>
                                <select class="form-select form-select-sm" id="filtroCategoria">
                                    <option selected>Todas</option>
                                    <option value="Estudio">Estudio</option>
                                    <option value="Desarrollo">Desarrollo</option>
                                    <option value="Personal">Personal</option>
                                </select>
                            </div>
                            <div class="col-4">
                                <label for="filtroFecha" class="form-label text-muted small fw-bold">FECHA</label>
                                <input type="date" class="form-control form-control-sm" id="filtroFecha">
                            </div>
                        </div>
                    </div>

                    <div id="contenedor-tareas">
                        <div class="alert alert-light text-center border text-muted py-4" role="alert">
                            No hay tareas registradas todavía. ¡Agrega una nueva tarea usando el formulario!
                        </div>
                    </div>

                </div>
            </section>

            <section class="col-lg-5">
                <div class="card shadow-sm p-4 bg-secondary-subtle">
                    <h2 class="h5 mb-3 text-secondary fw-bold text-center">FORMULARIO NUEVA TAREA</h2>
                    <form>
                        <div class="mb-3">
                            <label for="tituloTarea" class="form-label small fw-bold">TITULO DE LA TAREA:</label>
                            <input type="text" class="form-control" id="tituloTarea" placeholder="Texto...">
                        </div>
                        <div class="mb-3">
                            <label for="descripcionTarea" class="form-label small fw-bold">DESCRIPCIÓN DE LA TAREA:</label>
                            <textarea class="form-control" id="descripcionTarea" rows="2" placeholder="Texto..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="categoriaTarea" class="form-label small fw-bold">CATEGORÍA:</label>
                            <input type="text" class="form-control" id="categoriaTarea" placeholder="Ej. Estudio, Desarrollo...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold d-block">PRIORIDAD DE LA TAREA:</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="prioridad" id="prioAlta" value="Alta" checked>
                                <label class="form-check-label" for="prioAlta">Alta</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="prioridad" id="prioMedia" value="Media">
                                <label class="form-check-label" for="prioMedia">Media</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="prioridad" id="prioBaja" value="Baja">
                                <label class="form-check-label" for="prioBaja">Baja</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="fechaTarea" class="form-label small fw-bold">FECHA DE ENTREGA:</label>
                            <input type="date" class="form-control" id="fechaTarea">
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">+ AGREGAR TAREA NUEVA</button>
                    </form>
                </div>
            </section>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
